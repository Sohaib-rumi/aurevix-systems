<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" fill="none" class="aurevix-logo-lockup">
  <defs>
    <!-- Levo Studio Electric Amber Gradients -->
    <linearGradient id="lv-lockup-gold-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0d0"/>
      <stop offset="35%" stop-color="#ffc740"/>
      <stop offset="70%" stop-color="#ffb100"/>
      <stop offset="100%" stop-color="#d48c00"/>
    </linearGradient>

    <linearGradient id="lv-lockup-gold-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fff5e4"/>
      <stop offset="100%" stop-color="#ffc740"/>
    </linearGradient>

    <linearGradient id="lv-lockup-gold-facet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a5200" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#472f00" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1a1100" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="lv-lockup-dial-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0d0"/>
      <stop offset="60%" stop-color="#ffb100"/>
      <stop offset="100%" stop-color="#d48c00"/>
    </linearGradient>

    <filter id="lv-lockup-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left: The Logo Mark (Scale 0.75, offset) -->
  <g transform="translate(10, 15) scale(0.75)">
    <path d="M 96 46 C 73 50 56 65 48 83" 
          stroke="url(#lv-lockup-dial-grad)" stroke-width="3.5" stroke-linecap="round"/>

    <path d="M 106 46 C 136 50 160 74 160 106 C 160 119 155 132 147 142" 
          stroke="url(#lv-lockup-dial-grad)" stroke-width="3.5" stroke-linecap="round"/>

    <line x1="126" y1="57" x2="131" y2="64" stroke="url(#lv-lockup-dial-grad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="140" y1="71" x2="147" y2="79" stroke="url(#lv-lockup-dial-grad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="150" y1="88" x2="158" y2="94" stroke="url(#lv-lockup-dial-grad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="152" y1="108" x2="160" y2="110" stroke="url(#lv-lockup-dial-grad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="147" y1="127" x2="154" y2="132" stroke="url(#lv-lockup-dial-grad)" stroke-width="2.5" stroke-linecap="round"/>

    <g transform="rotate(38 138 65)">
      <rect x="135" y="63" width="6" height="5" rx="1" fill="url(#lv-lockup-gold-beam)"/>
      <rect x="131" y="58" width="14" height="5.5" rx="1.5" fill="url(#lv-lockup-gold-beam)"/>
    </g>

    <rect x="96" y="34" width="8" height="8" fill="url(#lv-lockup-gold-beam)"/>
    <rect x="88" y="28" width="24" height="6.5" rx="1.5" fill="url(#lv-lockup-gold-beam)"/>

    <path d="M 100 42 L 105 42 L 148 152 L 126 152 L 112 116 L 101 70 Z" 
          fill="url(#lv-lockup-gold-facet)"/>

    <path d="M 95 42 L 102 42 L 40 152 L 61 152 L 77 116 L 90 116 L 95 42 Z" 
          fill="url(#lv-lockup-gold-beam)"/>

    <path d="M 74 116 L 98 116 L 127 68 L 120 63 L 94 104 L 84 104 Z" 
          fill="url(#lv-lockup-gold-accent)" filter="url(#lv-lockup-glow)"/>

    <path d="M 125 120 L 148 152 L 165 152 L 138 120 Z" 
          fill="url(#lv-lockup-gold-beam)"/>
  </g>

  <!-- Right: The Official Typography -->
  <g transform="translate(160, 0)">
    <text x="0" y="80" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-weight="800" 
          font-size="34" 
          letter-spacing="0.08em" 
          fill="#ffffff">
      AUREVIX <tspan fill="url(#lv-lockup-gold-beam)">SYSTEMS</tspan>
    </text>

    <text x="3" y="112" 
          font-family="'JetBrains Mono', monospace" 
          font-weight="600" 
          font-size="12" 
          letter-spacing="0.28em" 
          fill="#ffb100">
      48H WEB PRODUCTION
    </text>

    <g transform="translate(3, 126)">
      <rect x="0" y="0" width="130" height="18" rx="4" fill="rgba(255,177,0,0.1)" stroke="rgba(255,177,0,0.3)"/>
      <circle cx="9" cy="9" r="3" fill="#34d399"/>
      <text x="18" y="12.5" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#ffffff" letter-spacing="0.05em">SLA // 48:00:00</text>
    </g>
  </g>
</svg>