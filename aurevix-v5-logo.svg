<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 22 140 136" fill="none" class="aurevix-logo-mark">
  <defs>
    <!-- Ultra-vivid Solar Gold Gradients for crisp display at all scales -->
    <linearGradient id="v5-gold-beam-hdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0d0"/>
      <stop offset="25%" stop-color="#f5c06d"/>
      <stop offset="70%" stop-color="#c89b53"/>
      <stop offset="100%" stop-color="#916424"/>
    </linearGradient>

    <!-- Specular White-Gold Gradient for Clock Needle -->
    <linearGradient id="v5-gold-accent-hdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fff5e4"/>
      <stop offset="100%" stop-color="#e8b96e"/>
    </linearGradient>

    <!-- Deep Metallic Bronze for Dimensional Right Facet -->
    <linearGradient id="v5-gold-facet-hdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#735020" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#4a3212" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#241707" stop-opacity="1.0"/>
    </linearGradient>

    <!-- Dial Arc Gradient -->
    <linearGradient id="v5-dial-grad-hdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0d0"/>
      <stop offset="50%" stop-color="#dfaf62"/>
      <stop offset="100%" stop-color="#a67730"/>
    </linearGradient>

    <filter id="v5-clarity-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#c89b53" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- ============================================== -->
  <!-- 1. CHRONOMETER CASING ARCS & PUSHERS           -->
  <!-- ============================================== -->

  <!-- Left Sweeping Arc (Bold 5.5px stroke) -->
  <path d="M 96 46 C 73 50 55 66 46 86" 
        stroke="url(#v5-dial-grad-hdr)" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Right Stopwatch Dial Arc (Bold 5.5px stroke) -->
  <path d="M 106 46 C 136 50 162 74 162 106 C 162 120 156 134 147 144" 
        stroke="url(#v5-dial-grad-hdr)" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Stopwatch Dial Ticks (Bold high-clarity 3.5px radial lines) -->
  <line x1="126" y1="56" x2="132" y2="64" stroke="url(#v5-dial-grad-hdr)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="141" y1="71" x2="149" y2="79" stroke="url(#v5-dial-grad-hdr)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="151" y1="88" x2="160" y2="94" stroke="url(#v5-dial-grad-hdr)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="153" y1="108" x2="162" y2="110" stroke="url(#v5-dial-grad-hdr)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="147" y1="127" x2="155" y2="133" stroke="url(#v5-dial-grad-hdr)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- 2 O'Clock Stopwatch Pusher Button -->
  <g transform="rotate(38 139 65)">
    <!-- Pusher Neck -->
    <rect x="135" y="62" width="7" height="6" rx="1.2" fill="url(#v5-gold-beam-hdr)"/>
    <!-- Pusher Cap -->
    <rect x="130" y="56" width="16" height="7" rx="2" fill="url(#v5-gold-beam-hdr)"/>
  </g>

  <!-- Top Apex Crown (12 o'clock Stopwatch Crown) -->
  <!-- Crown Neck -->
  <rect x="95" y="33" width="11" height="9" fill="url(#v5-gold-beam-hdr)"/>
  <!-- Crown Top Cap -->
  <rect x="86" y="26" width="28" height="8" rx="2" fill="url(#v5-gold-beam-hdr)"/>

  <!-- ============================================== -->
  <!-- 2. THE MONOGRAM 'A' ARCHITECTURE               -->
  <!-- ============================================== -->

  <!-- Right Leg Facet (Shaded Depth Behind Clock Hand) -->
  <path d="M 100 42 L 106 42 L 149 152 L 126 152 L 112 116 L 101 70 Z" 
        fill="url(#v5-gold-facet-hdr)"/>

  <!-- Left Leg (Solid Solar Gold Beam) -->
  <path d="M 94 42 L 102 42 L 38 152 L 62 152 L 77 116 L 90 116 L 94 42 Z" 
        fill="url(#v5-gold-beam-hdr)"/>

  <!-- Clock Hand / Chronograph Needle (Pointing to 2 O'Clock Pusher) -->
  <!-- Crisp high-contrast white & gold specular with drop glow -->
  <path d="M 72 116 L 98 116 L 128 67 L 119 61 L 93 103 L 83 103 Z" 
        fill="url(#v5-gold-accent-hdr)" filter="url(#v5-clarity-glow)"/>

  <!-- Right Leg Foot (Solid Solar Gold Base) -->
  <path d="M 125 120 L 149 152 L 168 152 L 138 120 Z" 
        fill="url(#v5-gold-beam-hdr)"/>

</svg>