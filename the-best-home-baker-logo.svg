<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .serif-text { font-family: 'Cormorant Garamond', Georgia, serif; }
      .sans-text { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
    </style>
  </defs>

  <!-- Background Base: Cotton Cream -->
  <rect width="500" height="500" fill="#E4D8CB" />

  <!-- Outer Architectural Guide Ring -->
  <circle cx="250" cy="250" r="210" fill="none" stroke="#CDC6C3" stroke-width="2" />
  <circle cx="250" cy="250" r="198" fill="none" stroke="#A09086" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Corner Accent Dots -->
  <circle cx="35" cy="35" r="4" fill="#A09086" />
  <circle cx="465" cy="35" r="4" fill="#A09086" />
  <circle cx="35" cy="465" r="4" fill="#A09086" />
  <circle cx="465" cy="465" r="4" fill="#A09086" />

  <!-- Botanical Wreath Accents: Rose Blonde & Dusty Brown -->
  <!-- Left Laurel Branch -->
  <path d="M 120 260 C 115 200, 150 140, 205 110" fill="none" stroke="#A09086" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 124 235 C 110 230, 112 215, 128 222 Z" fill="#CFB3A9" />
  <path d="M 135 195 C 120 188, 126 175, 140 184 Z" fill="#A09086" />
  <path d="M 155 160 C 142 150, 150 138, 162 150 Z" fill="#CFB3A9" />
  <path d="M 182 130 C 172 118, 184 108, 192 122 Z" fill="#A09086" />

  <!-- Right Laurel Branch -->
  <path d="M 380 260 C 385 200, 350 140, 295 110" fill="none" stroke="#A09086" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 376 235 C 390 230, 388 215, 372 222 Z" fill="#CFB3A9" />
  <path d="M 365 195 C 380 188, 374 175, 360 184 Z" fill="#A09086" />
  <path d="M 345 160 C 358 150, 350 138, 338 150 Z" fill="#CFB3A9" />
  <path d="M 318 130 C 328 118, 316 108, 308 122 Z" fill="#A09086" />

  <!-- Central Crest Circle -->
  <circle cx="250" cy="225" r="75" fill="#FAF7F2" stroke="#A09086" stroke-width="2" />
  <circle cx="250" cy="225" r="68" fill="none" stroke="#CDC6C3" stroke-width="1" />

  <!-- Central Monogram 'B' in Espresso Dark -->
  <text text-anchor="middle" x="250" y="252" class="serif-text" font-size="82" font-weight="600" fill="#231B16">B</text>

  <!-- Typography Lockup -->
  <g transform="translate(250, 348)">
    <text text-anchor="middle" y="0" class="serif-text" font-size="28" font-weight="600" fill="#231B16" letter-spacing="3">THE BEST HOME BAKER</text>
    <line x1="-120" y1="15" x2="-15" y2="15" stroke="#A09086" stroke-width="1" />
    <polygon points="0,11 4,15 0,19 -4,15" fill="#CFB3A9" />
    <line x1="15" y1="15" x2="120" y2="15" stroke="#A09086" stroke-width="1" />
    <text text-anchor="middle" y="34" class="sans-text" font-size="11" font-weight="600" fill="#4A3E37" letter-spacing="4">BESPOKE CAKE ATELIER</text>
    <text text-anchor="middle" y="54" class="sans-text" font-size="9" font-weight="600" fill="#A09086" letter-spacing="2">HANDMADE FROM SCRATCH</text>
  </g>
</svg>
