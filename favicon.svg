<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 22 140 136" fill="none" class="aurevix-logo-mark">
  <defs>
    <!-- Levo Studio Electric Amber Gradients -->
    <linearGradient id="lv-gold-beam-hdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0d0"/>
      <stop offset="25%" stop-color="#ffc740"/>
      <stop offset="70%" stop-color="#ffb100"/>
      <stop offset="100%" stop-color="#d48c00"/>
    </linearGradient>

    <!-- Specular White-Gold Gradient for Clock Needle -->
    <linearGradient id="lv-gold-accent-hdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fff5e4"/>
      <stop offset="100%" stop-color="#ffc740"/>
    </linearGradient>

    <!-- Deep Metallic Amber Charcoal for Dimensional Right Facet -->
    <linearGradient id="lv-gold-facet-hdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a5200" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#472f00" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#1a1100" stop-opacity="1.0"/>
    </linearGradient>

    <!-- Dial Arc Gradient -->
    <linearGradient id="lv-dial-grad-hdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0d0"/>
      <stop offset="50%" stop-color="#ffc740"/>
      <stop offset="100%" stop-color="#ffb100"/>
    </linearGradient>

    <filter id="lv-clarity-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#ffb100" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 1. CHRONOMETER CASING ARCS & PUSHERS -->
  <path d="M 96 46 C 73 50 55 66 46 86" 
        stroke="url(#lv-dial-grad-hdr)" stroke-width="5.5" stroke-linecap="round"/>

  <path d="M 106 46 C 136 50 162 74 162 106 C 162 120 156 134 147 144" 
        stroke="url(#lv-dial-grad-hdr)" stroke-width="5.5" stroke-linecap="round"/>

  <line x1="126" y1="56" x2="132" y2="64" stroke="url(#lv-dial-grad-hdr)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="141" y1="71" x2="149" y2="79" stroke="url(#lv-dial-grad-hdr)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="151" y1="88" x2="160" y2="94" stroke="url(#lv-dial-grad-hdr)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="153" y1="108" x2="162" y2="110" stroke="url(#lv-dial-grad-hdr)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="147" y1="127" x2="155" y2="133" stroke="url(#lv-dial-grad-hdr)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- 2 O'Clock Pusher -->
  <g transform="rotate(38 139 65)">
    <rect x="135" y="62" width="7" height="6" rx="1.2" fill="url(#lv-gold-beam-hdr)"/>
    <rect x="130" y="56" width="16" height="7" rx="2" fill="url(#lv-gold-beam-hdr)"/>
  </g>

  <!-- Top Crown -->
  <rect x="95" y="33" width="11" height="9" fill="url(#lv-gold-beam-hdr)"/>
  <rect x="86" y="26" width="28" height="8" rx="2" fill="url(#lv-gold-beam-hdr)"/>

  <!-- 2. THE MONOGRAM 'A' ARCHITECTURE -->
  <path d="M 100 42 L 106 42 L 149 152 L 126 152 L 112 116 L 101 70 Z" 
        fill="url(#lv-gold-facet-hdr)"/>

  <path d="M 94 42 L 102 42 L 38 152 L 62 152 L 77 116 L 90 116 L 94 42 Z" 
        fill="url(#lv-gold-beam-hdr)"/>

  <path d="M 72 116 L 98 116 L 128 67 L 119 61 L 93 103 L 83 103 Z" 
        fill="url(#lv-gold-accent-hdr)" filter="url(#lv-clarity-glow)"/>

  <path d="M 125 120 L 149 152 L 168 152 L 138 120 Z" 
        fill="url(#lv-gold-beam-hdr)"/>
</svg>